services:
  db:
    image: postgres:16-alpine
    container_name: solado-certo-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-solado_certo}
    ports:
      - "2345:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: solado-certo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  server:
    build:
      context: .
      dockerfile: .setup/build/dev/Dockerfile
    container_name: solado-certo-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/solado_certo?sslmode=disable}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (see README.md)}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - server_tmp:/app/tmp

volumes:
  server_tmp:
